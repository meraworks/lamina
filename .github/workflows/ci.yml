name: CI

# Documentation and image changes skip this workflow; docs.yml checks the docs.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/release-notes.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/release-notes.md"

# A new push cancels the run of the previous push on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  scripts:
    name: Scripts and issue forms
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and PyYAML
        run: python3 -m pip install --user pillow pyyaml
      - name: Check the issue forms
        run: python3 scripts/check_issue_forms.py
      - name: Test the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
