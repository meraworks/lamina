name: CI

# Documentation and image changes do not start a run.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/release-notes.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/release-notes.md"

# A new push cancels the run of the previous push on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # `lamina-viewer shot` (the viewer without a window) is behind a feature.
      - name: Clippy (viewer, headless)
        run: cargo clippy -p lamina-viewer --all-targets --features headless --locked -- -D warnings
      - name: Test (viewer, headless)
        run: cargo test -p lamina-viewer --features headless --locked

  viewer-smoke:
    name: Viewer smoke test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Mesa lavapipe: Vulkan on the CPU, for a runner without a GPU.
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Build
        run: |
          cargo build --locked -p lamina-mcp
          cargo build --locked -p lamina-viewer --features headless
      - name: Smoke test
        run: python3 scripts/viewer-smoke.py --bin target/debug --keep viewer-smoke
      - name: Keep the images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: viewer-smoke
          if-no-files-found: ignore

  scripts:
    name: Scripts and issue forms
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and PyYAML
        run: python3 -m pip install --user pillow pyyaml
      - name: Check the issue forms
        run: python3 scripts/check_issue_forms.py
      - name: Test the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
