name: Release

# Push a tag such as v0.1.0 to build and publish a release.
# Run the workflow by hand to build the archives without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, native: true }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lamina-mcp -p lamina-viewer

      - name: Smoke test
        if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release
          "$bin/lamina" --version
          "$bin/lamina" new smoke/board
          "$bin/lamina" status smoke/board
          "$bin/lamina-viewer" --help

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          name="lamina-$version-${{ matrix.target }}"
          mkdir "$name"
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/lamina$exe" "target/${{ matrix.target }}/release/lamina-viewer$exe" "$name/"
          cp README.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE "$name/"
          # The README links to these, so the archive needs them too.
          cp -R assets docs examples scripts "$name/"
          case "${{ matrix.target }}" in
            *windows*) 7z a -tzip "$name.zip" "$name" > /dev/null; archive="$name.zip" ;;
            *) tar -czf "$name.tar.gz" "$name"; archive="$name.tar.gz" ;;
          esac
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"
          else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Lamina ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
