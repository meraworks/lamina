name: Docs

# Keep documentation-only changes covered without starting the full CI matrix.
on:
  push:
    branches: [master]
    paths:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation against the programs
        run: cargo test -p lamina-mcp --bin lamina --locked doc_check
