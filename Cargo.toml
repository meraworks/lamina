[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
lamina-model = { path = "crates/lamina-model" }
lamina-ports = { path = "crates/lamina-ports" }
lamina-wiring = { path = "crates/lamina-wiring" }
lamina-geom = { path = "crates/lamina-geom" }
lamina-footprint = { path = "crates/lamina-footprint" }
lamina-parts = { path = "crates/lamina-parts" }
lamina-step = { path = "crates/lamina-step" }
lamina-drc = { path = "crates/lamina-drc" }
lamina-route = { path = "crates/lamina-route" }
lamina-export = { path = "crates/lamina-export" }
lamina-scene = { path = "crates/lamina-scene" }
lamina-render = { path = "crates/lamina-render" }
lamina-core = { path = "crates/lamina-core" }
lamina-build = { path = "crates/lamina-build" }
lamina-kicad = { path = "crates/lamina-kicad" }
lamina-specctra = { path = "crates/lamina-specctra" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
schemars = "1.2.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std", "time"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile = "3.27.0"
proptest = "1.12.0"
geo = "0.33.1"
wgpu = "30.0.1"
tiny-skia = "0.12.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
earcutr = "0.5.0"
glam = { version = "0.34.2", features = ["bytemuck"] }
jrsonnet-evaluator = { version = "0.5.0-pre98", default-features = false, features = ["ir-parser", "explaining-traces"] }
jrsonnet-stdlib = "0.5.0-pre98"

[patch.crates-io]
# See vendor/jrsonnet-stdlib/Cargo.toml.
jrsonnet-stdlib = { path = "vendor/jrsonnet-stdlib" }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"

[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"
